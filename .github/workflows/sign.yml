name: Sign CondoLoader

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.3.0

      - name: Sign the executable
        run: |
          cosign sign-blob --output-signature CondoLoader.exe.sig --output-certificate CondoLoader.exe.crt CondoLoader.exe
        env:
          COSIGN_EXPERIMENTAL: "true"

      - name: Upload Signed Files
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Files
          path: |
            CondoLoader.exe
            CondoLoader.exe.sig
            CondoLoader.exe.crt
